<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 24" width="900" height="24" fill="none">
  <defs>
    <linearGradient id="divGrad" x1="0" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0"/>
      <stop offset="15%" stop-color="#6366f1" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#10b981" stop-opacity="1"/>
      <stop offset="85%" stop-color="#6366f1" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="glowGrad" x1="0" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0"/>
      <stop offset="25%" stop-color="#6366f1" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.6"/>
      <stop offset="75%" stop-color="#6366f1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Ambient Glow Bar -->
  <rect x="50" y="9" width="800" height="6" rx="3" fill="url(#glowGrad)"/>

  <!-- Core Sharp Cyber Line -->
  <rect x="50" y="11" width="800" height="2" rx="1" fill="url(#divGrad)"/>

  <!-- Tech Accent Pips -->
  <circle cx="370" cy="12" r="2" fill="#6366f1" opacity="0.8"/>
  <circle cx="410" cy="12" r="2.5" fill="#6366f1"/>
  
  <!-- Center Jewel Hub -->
  <rect x="436" y="5" width="28" height="14" rx="7" fill="#07090e" stroke="#10b981" stroke-width="1.5"/>
  <circle cx="450" cy="12" r="4" fill="#10b981"/>

  <circle cx="490" cy="12" r="2.5" fill="#6366f1"/>
  <circle cx="530" cy="12" r="2" fill="#6366f1" opacity="0.8"/>
</svg>
