<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 20" width="880" height="20" fill="none">
  <defs>
    <linearGradient id="divGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0"/>
      <stop offset="30%" stop-color="#6366f1" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#10b981" stop-opacity="1"/>
      <stop offset="70%" stop-color="#6366f1" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <line x1="40" y1="10" x2="840" y2="10" stroke="url(#divGrad)" stroke-width="1.5" filter="url(#glow)"/>
  <circle cx="440" cy="10" r="3.5" fill="#10b981" filter="url(#glow)"/>
  <circle cx="410" cy="10" r="2" fill="#6366f1"/>
  <circle cx="470" cy="10" r="2" fill="#6366f1"/>
</svg>
