<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 130" width="540" height="130" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="sigGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="40%" stop-color="#a5b4fc"/>
      <stop offset="70%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#07090e" stop-opacity="0.98"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="sigGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes drawSig {
        0% {
          stroke-dashoffset: 1200;
          opacity: 0.2;
        }
        40% {
          opacity: 1;
        }
        80% {
          stroke-dashoffset: 0;
          opacity: 1;
        }
        100% {
          stroke-dashoffset: 0;
          opacity: 1;
        }
      }

      @keyframes shimmerGlow {
        0%, 100% { filter: drop-shadow(0 0 4px rgba(99, 102, 241, 0.4)) drop-shadow(0 0 10px rgba(16, 185, 129, 0.2)); }
        50% { filter: drop-shadow(0 0 8px rgba(99, 102, 241, 0.8)) drop-shadow(0 0 16px rgba(16, 185, 129, 0.5)); }
      }

      .sig-path {
        stroke-dasharray: 1200;
        stroke-dashoffset: 0;
        animation: drawSig 4s cubic-bezier(0.4, 0, 0.2, 1) forwards, shimmerGlow 3.5s ease-in-out infinite alternate 4s;
      }

      .dot-glow {
        animation: shimmerGlow 2s ease-in-out infinite alternate;
      }
    </style>
  </defs>

  <!-- Container -->
  <rect x="2" y="2" width="536" height="126" rx="14" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1.2"/>
  
  <!-- Subtle cyber accent ticks -->
  <line x1="14" y1="12" x2="28" y2="12" stroke="#6366f1" stroke-width="2" stroke-linecap="round"/>
  <line x1="512" y1="118" x2="526" y2="118" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>

  <!-- Calligraphic Cursive Signature: Ramesh G R -->
  <g class="sig-path" transform="translate(48, 16)" filter="url(#sigGlow)">
    <!-- 'R' Flourish -->
    <path d="M 22 72 C 20 60, 24 38, 27 20 C 27 15, 29 12, 33 13 C 38 14, 52 14, 62 20 C 72 26, 75 36, 68 44 C 62 50, 48 52, 28 50 C 42 54, 58 66, 74 74" 
          stroke="url(#sigGrad)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- 'a' -->
    <path d="M 82 52 C 77 46, 82 39, 90 39 C 98 39, 102 46, 100 56 C 98 64, 88 66, 84 61 C 80 57, 82 48, 93 45 C 99 44, 103 48, 103 58 C 103 62, 106 64, 110 60" 
          stroke="url(#sigGrad)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- 'm' -->
    <path d="M 112 58 C 114 48, 117 40, 120 40 C 124 40, 126 49, 127 58 C 130 46, 134 40, 138 40 C 142 40, 144 49, 145 58 C 148 46, 153 40, 157 40 C 162 40, 163 50, 164 59 C 164 63, 168 64, 172 58" 
          stroke="url(#sigGrad)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- 'e' -->
    <path d="M 174 56 C 172 48, 177 42, 185 41 C 193 40, 194 48, 187 53 C 178 60, 182 66, 193 61 C 197 59, 200 55, 203 53" 
          stroke="url(#sigGrad)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- 's' -->
    <path d="M 205 56 C 208 46, 214 38, 218 39 C 222 40, 218 47, 213 51 C 208 55, 210 64, 219 62 C 225 61, 228 55, 230 52" 
          stroke="url(#sigGrad)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- 'h' loop -->
    <path d="M 233 58 C 235 44, 238 28, 241 15 C 243 11, 247 12, 246 19 C 243 36, 241 52, 241 62 C 246 51, 252 42, 258 42 C 265 42, 267 52, 267 61 C 268 66, 274 65, 280 56" 
          stroke="url(#sigGrad)" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Space separator flourish -->
    <path d="M 292 48 C 298 44, 303 52, 298 56" stroke="url(#sigGrad)" stroke-width="2.2" stroke-linecap="round" fill="none"/>

    <!-- 'G' Grand flourish -->
    <path d="M 342 22 C 330 14, 314 18, 308 32 C 302 46, 308 66, 322 72 C 334 76, 345 68, 345 54 L 332 54" 
          stroke="url(#sigGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- 'R' Final flourish & trailing paraph -->
    <path d="M 364 68 C 363 54, 365 38, 368 22 C 374 22, 386 20, 394 28 C 400 34, 398 42, 388 47 C 378 51, 367 49, 366 49 C 374 53, 384 62, 396 70 C 408 78, 426 80, 442 76" 
          stroke="url(#sigGrad)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Calligraphic underline / dynamic stroke -->
    <path d="M 50 82 C 140 76, 260 84, 380 78 C 420 76, 450 71, 465 67" 
          stroke="url(#sigGrad)" stroke-width="2" stroke-linecap="round" opacity="0.85" fill="none"/>
  </g>

  <!-- Calligraphy Metadata Caption -->
  <g transform="translate(48, 110)">
    <circle cx="8" cy="-4" r="3" fill="#10b981" class="dot-glow"/>
    <text x="20" y="0" fill="#94a3b8" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="10.5" font-weight="600" letter-spacing="1.2">
      RAMESH G R <tspan fill="#6366f1">|</tspan> DATA ENGINEER &amp; PYTHON DEVELOPER <tspan fill="#64748b">[ramz]</tspan>
    </text>
  </g>
</svg>
